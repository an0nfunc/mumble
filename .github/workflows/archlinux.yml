name: Arch Linux package

on:
  push:
    branches: '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - name: Install git
      run: pacman -Syu --noconfirm --needed git

    - uses: actions/checkout@v6
      with:
        # pkgver counts the commits
        fetch-depth: 0
        submodules: 'recursive'
        persist-credentials: false

    - name: Build packages
      run: |
        useradd -m builder
        echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
        chown -R builder: .
        cd .github/archlinux
        sudo -u builder makepkg --syncdeps --noconfirm

    - uses: actions/upload-artifact@v7
      with:
        name: archlinux-packages
        path: .github/archlinux/*.pkg.tar.zst
